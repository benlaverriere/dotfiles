name: rubyfmt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rubyfmt:
    runs-on: macos-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.4', '4.0', head]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Install rubyfmt
      run: |
        brew install rubyfmt
        brew install fd
    - name: Run rubyfmt
      run: rubyfmt -c . Rakefile $(fd "rake")
